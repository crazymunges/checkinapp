<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日打卡</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="打卡">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2026; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2f7d5b; --late: #c2410c; --h0: #e7eaee; --h1: #b7e1c9; --h2: #6cc496; --h3: #2f7d5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --card: #1f2229; --text: #e8eaed; --muted: #9aa0a6; --line: #2e323b;
      --accent: #5cc08d; --late: #fb923c; --h0: #2a2e36; --h1: #1f5a3f; --h2: #2f8a5e; --h3: #5cc08d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg);
    display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  header button { background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; width: 40px; height: 40px; font-size: 18px; }
  #status { padding: 4px 16px; min-height: 24px; font-size: 13px; color: var(--muted); }
  #status[data-kind=ok] { color: var(--accent); }
  #status[data-kind=err] { color: var(--late); }
  main { padding: 0 16px 40px; max-width: 640px; margin: 0 auto; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 12px 0; }
  details section { border: 0; margin: 0; padding: 4px 0 0; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 12px 0; }
  summary { font-weight: 600; cursor: pointer; }
  h2 { font-size: 17px; margin: 0 0 6px; }
  h2 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 12px 0 4px; }
  ul { list-style: none; margin: 0; padding: 0; }
  .task { display: grid; grid-template-columns: 28px 1fr; gap: 2px 8px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  li:first-child .task { border-top: 0; }
  .task input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); grid-row: span 2; }
  .task.done .desc { color: var(--muted); text-decoration: line-through; }
  .meta { grid-column: 2; font-size: 12px; color: var(--muted); }
  .late { color: var(--late); font-weight: 600; }
  .empty { color: var(--muted); margin: 6px 0; }
  .center { text-align: center; padding: 28px 16px; }
  .primary { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 12px 28px; font-size: 16px; }
  .heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; margin-top: 6px; }
  .heat i { aspect-ratio: 1; border-radius: 3px; background: var(--h0); }
  .heat .l1 { background: var(--h1); } .heat .l2 { background: var(--h2); } .heat .l3 { background: var(--h3); }
  .heat .lf { background: transparent; }
  .crumb { font-size: 13px; color: var(--muted); word-break: break-all; }
  .picker button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line);
    color: var(--text); padding: 12px 2px; font-size: 15px; }
  code { background: var(--h0); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1 id="today">每日打卡</h1>
  <button id="refresh" aria-label="刷新">↻</button>
  <button id="settings" aria-label="设置">⚙</button>
</header>
<div id="status"></div>
<main id="app"><p class="empty">加载中…</p></main>
<script src="vendor/msal-browser.min.js"></script>
<script src="config.js"></script>
<script src="tasks.js"></script>
<script src="app.js"></script>
</body>
</html>
